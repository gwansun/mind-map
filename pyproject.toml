[tool.poetry]
name = "mind-map"
version = "0.1.0"
description = "Knowledge Graph-based Mind Map with LangGraph orchestration"
authors = ["Mind Map Team"]
readme = "README.md"
packages = [{include = "mind_map", from = "src"}]

[tool.poetry.scripts]
mind-map = "mind_map.app.cli.main:app"

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^0.2"
langchain = "^0.3"
langchain-ollama = "^0.2"
chromadb = "^1.5.2"
typer = {extras = ["all"], version = "^0.15"}
ollama = "^0.6"
rich = "^13"
pydantic = "^2"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.35"}
pyyaml = "^6"
python-dotenv = "^1"
langchain-openai = "^0.3"
langchain-anthropic = "^0.3"
langchain-google-genai = "^2.0"
fastmcp = "^2.14.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8"
ruff = "^0.8"
mypy = "^1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

# Keep aliased members of the same module in one grouped statement. Ruff's default
# splits them one-per-statement, which fragmented mcp/server.py's services import
# into ten lines and added six new E402s (the file bootstraps sys.path between
# import groups).
[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# server.py appends its own package root to sys.path before importing mind_map.*, so
# the MCP host can launch the file directly. That bootstrap has to run before those
# imports, which is exactly the pattern E402 flags -- the ordering is deliberate here.
"src/mind_map/mcp/server.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "ollama.*", "langgraph.*", "langchain.*", "langchain_ollama.*", "langchain_openai.*", "langchain_anthropic.*", "langchain_google_genai.*"]
ignore_missing_imports = true
