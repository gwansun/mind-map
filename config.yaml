chroma:
  collection_name: mind_map_nodes
  embedding_model: nomic-embed-text
graph:
  default_depth: 2
  max_connections: 50
importance:
  lambda_decay: 0.05
  time_unit: days
processing_llm:
  provider: ollama          # auto | gemini | anthropic | openai | ollama
  auto_pull: false
  model: phi3.5           # Ollama model (used when provider is ollama or auto-fallback)
  temperature: 0.1
reasoning_llm:
  provider: deepseek            # Options: deepseek, minimax-direct, claude-cli, gemini, anthropic, openai
  model: deepseek/deepseek-v4.1-flash   # For deepseek: model id (override via MIND_MAP_LLM_MODEL)
  temperature: 0.7
  timeout: 120             # Timeout in seconds for agent/CLI calls

